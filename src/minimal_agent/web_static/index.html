<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Minimal Agent Workbench</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260811-delete" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="会话导航">
        <div class="sidebar-top">
          <div class="brand-row">
            <button id="traceButton" class="icon-button trace-button" aria-label="查看 Trace" title="查看 Trace">
              <span class="trace-mark">⌁</span>
            </button>
            <div class="brand">
              <span class="brand-dot"></span>
              <span>Minimal Agent</span>
            </div>
            <button id="collapseSidebar" class="icon-button collapse-button" aria-label="收起侧栏">‹</button>
          </div>
          <button id="newSessionButton" class="new-session-button">
            <span>＋</span><span>新任务</span><kbd>Ctrl K</kbd>
          </button>
        </div>

        <div class="session-section">
          <div class="section-label">任务</div>
          <div id="sessionList" class="session-list"></div>
        </div>

        <div class="sidebar-footer">
          <div class="provider-note">
            <span class="status-dot"></span>
            <span>Wikipedia · Open-Meteo</span>
          </div>
          <button id="accountButton" class="account-button" aria-haspopup="menu" aria-expanded="false">
            <span id="accountAvatar" class="avatar">?</span>
            <span class="account-copy">
              <strong id="accountName">未登录</strong>
              <small id="accountUsername">选择账户</small>
            </span>
            <span class="chevron">⌃</span>
          </button>
          <div id="accountMenu" class="account-menu hidden" role="menu">
            <div class="menu-label">已登录账户</div>
            <div id="accountList"></div>
            <button id="addAccountButton" class="menu-action" role="menuitem">＋ 登录另一个用户</button>
            <button id="logoutButton" class="menu-action danger" role="menuitem">退出当前账户</button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <button id="mobileSidebarButton" class="icon-button mobile-only" aria-label="打开侧栏">☰</button>
          <div>
            <h1 id="sessionTitle">新任务</h1>
          </div>
        </header>

        <section id="chatArea" class="chat-area" aria-live="polite">
          <div id="emptyState" class="empty-state">
            <div class="empty-symbol"><span></span></div>
            <h2>今天想完成什么？</h2>
            <p>选择示例测试免费天气、Wikipedia 搜索或计算器工具。</p>
            <div class="prompt-grid">
              <button class="prompt-card" data-prompt="使用天气工具查询上海明天的真实天气预报">
                <span>测试天气</span><small>使用 Open-Meteo 查询上海明天</small>
              </button>
              <button class="prompt-card" data-prompt="使用 Wikipedia 搜索工具查询人工智能代理，并总结搜索结果">
                <span>测试 Wiki 搜索</span><small>使用 Wikipedia 查询百科知识</small>
              </button>
              <button class="prompt-card" data-prompt="使用计算器工具计算 (128 + 72) * 3 / 4">
                <span>测试计算器</span><small>计算 (128 + 72) × 3 ÷ 4</small>
              </button>
            </div>
          </div>
          <div id="messageList" class="message-list"></div>
        </section>

        <footer class="composer-wrap">
          <form id="composerForm" class="composer">
            <textarea id="messageInput" rows="1" maxlength="20000" placeholder="向 Agent 发送消息" aria-label="消息"></textarea>
            <div class="composer-actions">
              <span id="composerHint">Enter 发送 · Shift Enter 换行</span>
              <button id="sendButton" type="submit" class="send-button" aria-label="发送">
                <span>↑</span>
              </button>
            </div>
          </form>
          <p class="disclaimer">Agent 可能出错。Search 仅覆盖 Wikipedia；Open-Meteo 免费接口仅用于非商业演示。</p>
        </footer>
      </main>

      <aside id="tracePanel" class="trace-panel" aria-label="Trace 查看器" aria-hidden="true">
        <div class="trace-header">
          <div>
            <span class="eyebrow">运行可观测性</span>
            <h2>Trace</h2>
          </div>
          <button id="closeTraceButton" class="icon-button trace-close" type="button" aria-label="关闭 Trace">×</button>
        </div>
        <div id="traceEmpty" class="trace-empty">当前会话还没有 Trace。发送消息后可查看完整执行记录。</div>
        <div id="traceContent" class="trace-content hidden">
          <label class="trace-select-label" for="traceSelect">请求</label>
          <select id="traceSelect" class="trace-select"></select>
          <div id="traceSummary" class="trace-summary"></div>
          <div id="traceEvents" class="trace-events"></div>
        </div>
      </aside>
      <div id="panelScrim" class="panel-scrim hidden"></div>
    </div>

    <div id="loginModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="login-modal">
        <button id="closeLoginButton" class="modal-close" type="button" aria-label="关闭登录窗口">×</button>
        <div class="login-brand"><span class="brand-dot"></span> Minimal Agent</div>
        <h2 id="loginTitle">登录工作台</h2>
        <form id="loginForm">
          <label>用户名<input id="loginUsername" autocomplete="username" required maxlength="64" /></label>
          <label>密码<input id="loginPassword" type="password" autocomplete="current-password" required maxlength="256" /></label>
          <div id="loginError" class="form-error" role="alert"></div>
          <button id="loginSubmit" type="submit" class="primary-button">登录</button>
        </form>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="/static/app.js?v=20260811-delete" defer></script>
  </body>
</html>
