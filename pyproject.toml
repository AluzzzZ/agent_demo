[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "minimal-agent"
version = "0.2.0"
description = "A minimal agent runtime built without an agent framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "jsonschema>=4.18",
  "openai>=1.54",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "pytest-cov>=5.0"]
anthropic = ["anthropic>=0.42"]

[project.scripts]
minimal-agent = "minimal_agent.cli:main"
minimal-agent-web = "minimal_agent.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minimal_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "live_api: calls a real paid LLM API and may incur cost",
]
